# Database (Render PostgreSQL / local PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aptquiz}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Hibernate will auto-detect PostgreSQL from the JDBC driver.

# Render provides PORT. Keep 8080 as the local default.
server.port=${PORT:8080}
server.address=0.0.0.0

# Set this to the exact Render frontend URL in production.
app.frontend-url=${FRONTEND_URL:*}
